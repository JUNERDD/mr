name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Check, Build, and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Run checks
        run: npm run check

      - name: Package prebuilt installer artifact
        run: npm run pack:release

      - name: Smoke test packaged CLI
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          tar -xzf artifacts/mr.tar.gz -C "$tmp_dir"
          "$tmp_dir/mr/dist/index.js" --version

      - name: Smoke test installer
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          tmp_rc="$(mktemp)"
          MR_TARBALL_URL="file://${PWD}/artifacts/mr.tar.gz" \
          MR_INSTALL_DIR="$tmp_home/share/mr" \
          MR_BIN_DIR="$tmp_home/bin" \
          MR_RC="$tmp_rc" \
          bash install.sh
          "$tmp_home/bin/mr" --version

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: mr
          path: |
            artifacts/mr.tar.gz
            artifacts/mr.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: mr
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/mr.tar.gz artifacts/mr.sha256 --clobber
          else
            gh release create "$TAG_NAME" artifacts/mr.tar.gz artifacts/mr.sha256 \
              --title "$TAG_NAME" \
              --notes "Prebuilt mr package."
          fi
